name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: microsoft/setup-msbuild@v2

      - name: Build Release x86
        run: msbuild src\SC4RegionSync.sln /m /p:Configuration=Release /p:Platform=Win32

      - name: Build Debug x86
        run: msbuild src\SC4RegionSync.sln /m /p:Configuration=Debug /p:Platform=Win32

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src\Release\SC4RegionSync.dll out\
          Copy-Item src\Release\SC4RegionSync.pdb out\
          Copy-Item src\SC4RegionSync.ini out\
          Copy-Item src\Debug\SC4RegionSync.dll out\SC4RegionSync.debug.dll
          Copy-Item src\Debug\SC4RegionSync.pdb out\SC4RegionSync.debug.pdb

      - uses: actions/upload-artifact@v4
        with:
          name: SC4RegionSync
          path: out/
