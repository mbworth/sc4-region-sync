; SC4RegionSync settings. Lives next to SC4RegionSync.dll in the Plugins folder.

[Sync]
; Master switch. 0 = only register cheats and log, never publish/pull automatically.
Enabled=1

; Automatic cadence in sim months. 0 disables that action.
PublishEveryMonths=1
PullEveryMonths=1
; Phase 1b experiment: fast-save on a cadence so the other instance can RegionSyncReload us.
AutoSaveEveryMonths=0

PublishOnLoad=1
PullOnLoad=1
; 0 removes this city's snapshot when the city closes, so a later load sees the
; saved record instead of stale (possibly unsaved) numbers. 1 publishes instead.
PublishOnShutdown=0

; Call UpdateCityCache before capturing so the snapshot reflects the live city.
RefreshCacheBeforePublish=1

; Close the game's single-instance mutex at startup so a second instance can
; launch (Q5, confirmed 2026-10-17). 0 = only when you type RegionSyncUnlock.
; Steam builds also need steam_appid.txt next to the exe; Setup-MultiInstance
; writes it.
ReleaseInstanceMutexOnStart=1

; Write pulled snapshots into the other tiles' regional records. 0 = read the
; store and log only.
ApplyPulledSnapshots=1

; Which fields a pull writes into the other tiles' records. Comma list of:
; established, budget, income, commodities, population.
ApplyFields=established,budget,income,commodities,population

; Call the neighbors simulator's MarkDealsDirty after a pull changed something.
MarkDealsDirty=1

; After a pull, add the change in regional population into the demand
; simulator's regional (0x10000) objects, as the game does at city load.
ApplyRegionalDemand=1

; With live numbers the game's own guess at neighbor growth (up to 1000 per
; RCI type every few months, undone by the next pull) only makes the demand
; graph saw-tooth (Q16). 1 = pin each pulled record's extrapolation cap to the
; live value so that guess adds nothing.
FreezeExtrapolation=1

; Tiles summed for that change: all (every established tile) or connected
; (GetAllConnectedCities, what the game uses). Flip to connected after it has
; been observed stable; the connected set is logged at load either way.
RegionalSumSet=all

; After a pull, create the other instances' edge connections and deals in this
; city on the next sim day (Phase 2 slice 1, create only; removal is not
; mirrored yet). Proven with the cheat run in docs/OPEN-QUESTIONS.md Q9
; (2026-10-18). RegionSyncMirror does the same once on demand.
SyncConnections=1
SyncDeals=1

; Lay the 3-cell network piece under each mirrored connection, demolishing the
; three edge cells first as the game does at load (Q10, 2026-10-18).
LayEdgeNetwork=1

; Remove connections and deals a live neighbor no longer lists (Q11, 2026-10-18).
; Needs SyncConnections/SyncDeals; RegionSyncMirror always removes.
SyncRemovals=1

; Delete another instance's snapshot when its game process is gone (Exit sends no
; shutdown, Q9 step 3). Same machine only: snapshots from other hosts are kept.
CheckWriterLiveness=1

; Hold a region-wide lock across every save so two instances never write each
; other's .sc4 at once (Q4). Both instances need it; RegionSyncHoldLock tests it.
SaveLock=1
; Longest a save waits for the other instance, then saves unlocked. 0 = never wait.
SaveLockTimeoutMs=15000

; Empty = <Plugins folder>\RegionSync\<region folder name>. Set explicitly if your
; two instances do not share one install.
StoreDirectory=

[Logging]
; Info, Error, Debug, Trace
LogLevel=Debug
